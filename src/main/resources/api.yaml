openapi: 3.0.1
info:
  title: Grocery Store API
  version: 1.0.0
paths:
  /items:
    get:
      summary: Get inventory of goods
      parameters:
        - in: query
          name: type
          schema:
            type: string
          description: Filter by grocery type
        - in: query
          name: page
          schema:
            type: integer
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
          description: Number of items per page
      responses:
        '200':
          description: A list of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '400':
          description: Invalid query parameters
    post:
      summary: Add a new item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: Item successfully created
        '400':
          description: Invalid request body
  /items/{itemId}:
    patch:
      summary: Update item cost
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
          description: ID of the item to update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: number
      responses:
        '200':
          description: Price updated successfully
        '400':
          description: Invalid request body
        '404':
          description: Item not found
    delete:
      summary: Delete an item
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
          description: ID of the item to delete
      responses:
        '200':
          description: Item deleted successfully
        '404':
          description: Item not found
  /items/{itemId}/quantity:
    patch:
      summary: Remove item quantity
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
          description: ID of the item to update quantity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: number
      responses:
        '200':
          description: Quantity updated successfully
        '400':
          description: Invalid request body
        '404':
          description: Item not found
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        price:
          type: number
        quantity:
          type: number
    NewItem:
      type: object
      required:
        - name
        - type
        - price
        - quantity
      properties:
        name:
          type: string
        type:
          type: string
        price:
          type: number
        quantity:
          type: number